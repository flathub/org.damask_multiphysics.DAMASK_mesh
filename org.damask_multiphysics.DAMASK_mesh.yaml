id: org.damask_multiphysics.DAMASK_mesh
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: DAMASK_mesh
finish-args:
  - --filesystem=xdg-documents

modules:
  - name: petsc_damask_mesh
    buildsystem: autotools
    build-options:
      env:
        PETSC_ARCH: "gfortran-openmpi"
        PETSC_DIR: "/run/build/petsc_damask_mesh"
    config-opts:
      - --with-shared-libraries=1
      - --with-debugging=0
      - --with-mpi-ftn-module=mpi_f08
      - --COPTFLAGS=-O3
      - --FOPTFLAGS=-O3
      - --CXXOPTFLAGS=-O3
      - --with-packages-download-dir=/run/build/petsc_damask_mesh
      - --download-openmpi=1
      - --download-fblaslapack=1
      - --download-hdf5=1
      - --download-zlib=1
      - --with-hdf5-fortran-bindings=1
    sources:
      - type: archive
        url: https://web.cels.anl.gov/projects/petsc/download/release-snapshots/petsc-3.25.3.tar.gz
        sha256: 95ce60df2c7f9c5044d6a544c41e996a512557f91df1a60bdb690b332904ebb5
      - type: file
        url: https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.9.tar.gz
        sha256: be35ac3aae68609dedf56a3c6480cb1b0af9ae40b98cc83ef27bc859084a9aa8
      - type: file
        url: https://bitbucket.org/petsc/pkg-fblaslapack/get/v3.4.2-p3.tar.gz
        sha256: 644629f3559bf7ecdb8d01975131f982b15da823a39c5df4fa5764a4a5e9b34a
      - type: file
        url: https://web.cels.anl.gov/projects/petsc/download/externalpackages/hdf5-1.14.6.tar.gz
        sha256: 09ee1c671a87401a5201c06106650f62badeea5a3b3941e9b1e2e1e08317357f
      - type: file
        url: https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
        sha256: bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16

  - name: libfyaml_damask_mesh
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/pantoniou/libfyaml/releases/download/v0.9.6/libfyaml-0.9.6.tar.gz
        sha256: a59cc3331e2eb903ec36933ad52a45888041cac31e44f553a00511131242c483

  - name: damask_mesh
    buildsystem: cmake
    config-opts:
      - -DMESH=ON
    build-options:
      env:
        PETSC_DIR: "/app"
    post-install:
      - install -Dm644 org.damask_multiphysics.DAMASK_mesh.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 org.damask_multiphysics.DAMASK_mesh.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: archive
        url: https://damask-multiphysics.org/download/damask-3.1.0.tar.xz
        sha256: d1ba65a167aab221c13f003507aba17f663c53af94fc1cd4a47408008329def1
      - type: file
        path: org.damask_multiphysics.DAMASK_mesh.metainfo.xml
      - type: file
        path: org.damask_multiphysics.DAMASK_mesh.svg
